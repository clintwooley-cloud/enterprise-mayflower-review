<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <style>
    .bg { fill:#f7f3ea; }
    .parcel { fill:#f5e6bf; stroke:#6e5a2f; stroke-width:4; }
    .road { fill:#8b8f97; stroke:#585d66; stroke-width:2; }
    .roadText { font: 700 24px Arial, sans-serif; fill:#ffffff; }
    .lot { fill:#d8f0d2; stroke:#3f6b3f; stroke-width:2; }
    .lotAlt { fill:#cae7f7; stroke:#37627b; stroke-width:2; }
    .open { fill:#dff3df; stroke:#4b8c4b; stroke-width:3; stroke-dasharray:8 6; }
    .corridor { fill:#b9d7f5; stroke:#3e6f9b; stroke-width:3; stroke-dasharray:12 8; opacity:.85; }
    .text { font: 22px Arial, sans-serif; fill:#27313a; }
    .small { font: 18px Arial, sans-serif; fill:#27313a; }
    .label { font: 700 20px Arial, sans-serif; fill:#1d2a33; }
    .title { font: 700 34px Arial, sans-serif; fill:#172028; }
    .subtitle { font: 22px Arial, sans-serif; fill:#43515d; }
    .note { font: 18px Arial, sans-serif; fill:#4c5b66; }
  </style>
  <rect class="bg" x="0" y="0" width="1400" height="980" />
  <text x="60" y="60" class="title">Enterprise / Mayflower concept B — 18 to 20-unit premium/open-space plan</text>
  <text x="60" y="95" class="subtitle">Concept only • not survey-grade • based on ~5.03 acres, ~101' Mayflower access, and a NW→SE sewer/creek corridor</text>

