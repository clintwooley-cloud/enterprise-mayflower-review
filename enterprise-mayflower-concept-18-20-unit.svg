<text x="1030" y="300" class="label">Why 18-20 is attractive</text>
<text x="1030" y="335" class="note">• Stronger premium feel for investor resales</text>
<text x="1030" y="365" class="note">• Easier parking ratios and guest circulation</text>
<text x="1030" y="395" class="note">• More room to respect the creek/easement corridor</text>
<text x="1030" y="425" class="note">• Lower entitlement / engineering pressure than 25 units</text>
<text x="1030" y="455" class="note">• 19-20 only if parking + fire turnaround stay clean</text>
