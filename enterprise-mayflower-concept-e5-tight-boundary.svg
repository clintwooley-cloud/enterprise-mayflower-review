<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
  <style>
    .title { font:700 42px Arial,sans-serif; fill:#172028; }
    .subtitle { font:26px Arial,sans-serif; fill:#43515d; }
    .note { font:24px Arial,sans-serif; fill:#24323a; }
    .tiny { font:18px Arial,sans-serif; fill:#33424d; }
    .parcel { fill:#f4cf6a; fill-opacity:.18; stroke:#9a5a00; stroke-width:6; }
    .drive { fill:none; stroke:#616872; stroke-width:38; stroke-linecap:round; opacity:.92; }
    .court { fill:#ececec; stroke:#777; stroke-width:3; opacity:.96; }
    .stall { fill:#fafafa; stroke:#999; stroke-width:1.5; }
    .green { fill:#dff3df; stroke:#4b8c4b; stroke-width:4; stroke-dasharray:10 8; opacity:.85; }
    .cottage { fill:#d8f0d2; stroke:#3f6b3f; stroke-width:3; opacity:.95; }
    .cottageAlt { fill:#cae7f7; stroke:#37627b; stroke-width:3; opacity:.95; }
    .corridor { fill:#9fc6ea; stroke:#2e648f; stroke-width:4; stroke-dasharray:14 10; opacity:.45; }
    .callout { fill:#ffffff; stroke:#cfd8de; stroke-width:2; opacity:.96; }
    .arrow { fill:none; stroke:#27485d; stroke-width:3; marker-end:url(#arrow); }
    .target { fill:none; stroke:#b32525; stroke-width:5; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#27485d" />
    </marker>
  </defs>
  <image href="enterprise-plat-rendered.png" x="0" y="0" width="2200" height="1700" />
  <rect x="0" y="0" width="2200" height="190" fill="#f7f3ea" opacity=".88" />
  <text x="55" y="60" class="title">Enterprise / Mayflower concept E5 — tighter boundary traced review version</text>
  <text x="55" y="102" class="subtitle">18-site-built-cottage concept • entry anchored to your black Mayflower marker • tighter parcel trace over actual plat</text>
  <text x="55" y="145" class="tiny">Still conceptual, but this version traces the apparent parcel envelope much more tightly so we can judge fit, setbacks, and parking pressure better.</text>

  <!-- traced parcel envelope -->
  <polygon class="parcel" points="855,448 1065,452 1250,535 1440,860 1505,1085 1340,1225 1085,1335 835,1260 660,1090 610,905 655,735 755,565" />

  <!-- no-build/common corridor -->
  <polygon class="corridor" points="780,905 1005,860 1430,1210 1195,1320 930,1180" />

  <!-- entry marker and internal drive -->
  <rect class="target" x="840" y="425" width="90" height="48" rx="6" />
  <path class="drive" d="M885,448 C900,520 955,620 1035,735 C1090,815 1145,900 1215,985" />
  <path class="drive" d="M1030,735 C915,780 815,845 725,950" />
  <path class="drive" d="M1075,790 C1220,820 1340,875 1450,965" />

  <rect class="green" x="1015" y="760" width="285" height="235" rx="26" />
  <text x="1158" y="870" text-anchor="middle" class="note">commons / paseo green</text>
  <text x="1158" y="905" text-anchor="middle" class="tiny">mail • pavilion • walk path</text>

  <!-- cottages fit tighter to traced envelope -->
  <g>
    <rect class="cottage" x="790" y="535" width="96" height="64" rx="7" /><text x="838" y="575" text-anchor="middle" class="tiny">1</text>
    <rect class="cottage" x="915" y="575" width="96" height="64" rx="7" /><text x="963" y="615" text-anchor="middle" class="tiny">2</text>
    <rect class="cottage" x="1045" y="585" width="96" height="64" rx="7" /><text x="1093" y="625" text-anchor="middle" class="tiny">3</text>
    <rect class="cottage" x="1180" y="620" width="96" height="64" rx="7" /><text x="1228" y="660" text-anchor="middle" class="tiny">4</text>
    <rect class="cottage" x="1305" y="710" width="96" height="64" rx="7" /><text x="1353" y="750" text-anchor="middle" class="tiny">5</text>
    <rect class="cottageAlt" x="1400" y="825" width="96" height="64" rx="7" /><text x="1448" y="865" text-anchor="middle" class="tiny">6</text>
    <rect class="cottageAlt" x="1425" y="955" width="96" height="64" rx="7" /><text x="1473" y="995" text-anchor="middle" class="tiny">7</text>
    <rect class="cottageAlt" x="1340" y="1070" width="96" height="64" rx="7" /><text x="1388" y="1110" text-anchor="middle" class="tiny">8</text>
    <rect class="cottageAlt" x="1215" y="1160" width="96" height="64" rx="7" /><text x="1263" y="1200" text-anchor="middle" class="tiny">9</text>
    <rect class="cottageAlt" x="1080" y="1215" width="96" height="64" rx="7" /><text x="1128" y="1255" text-anchor="middle" class="tiny">10</text>
    <rect class="cottageAlt" x="940" y="1200" width="96" height="64" rx="7" /><text x="988" y="1240" text-anchor="middle" class="tiny">11</text>
    <rect class="cottageAlt" x="805" y="1140" width="96" height="64" rx="7" /><text x="853" y="1180" text-anchor="middle" class="tiny">12</text>
    <rect class="cottage" x="700" y="1050" width="96" height="64" rx="7" /><text x="748" y="1090" text-anchor="middle" class="tiny">13</text>
    <rect class="cottage" x="650" y="935" width="96" height="64" rx="7" /><text x="698" y="975" text-anchor="middle" class="tiny">14</text>
    <rect class="cottage" x="665" y="810" width="96" height="64" rx="7" /><text x="713" y="850" text-anchor="middle" class="tiny">15</text>
    <rect class="cottage" x="710" y="695" width="96" height="64" rx="7" /><text x="758" y="735" text-anchor="middle" class="tiny">16</text>
    <rect class="cottage" x="735" y="595" width="96" height="64" rx="7" /><text x="783" y="635" text-anchor="middle" class="tiny">17</text>
    <rect class="cottage" x="865" y="1288" width="96" height="64" rx="7" /><text x="913" y="1328" text-anchor="middle" class="tiny">18</text>
  </g>

  <!-- tighter parking courts -->
  <g>
    <rect class="court" x="735" y="470" width="320" height="82" rx="12" />
    <text x="895" y="458" text-anchor="middle" class="tiny">front arrival court — 10 spaces</text>
    <rect class="stall" x="750" y="483" width="24" height="52" /><rect class="stall" x="778" y="483" width="24" height="52" /><rect class="stall" x="806" y="483" width="24" height="52" /><rect class="stall" x="834" y="483" width="24" height="52" /><rect class="stall" x="862" y="483" width="24" height="52" />
    <rect class="stall" x="926" y="483" width="24" height="52" /><rect class="stall" x="954" y="483" width="24" height="52" /><rect class="stall" x="982" y="483" width="24" height="52" /><rect class="stall" x="1010" y="483" width="24" height="52" /><rect class="stall" x="1038" y="483" width="24" height="52" />

    <rect class="court" x="585" y="1165" width="215" height="82" rx="12" />
    <text x="692" y="1153" text-anchor="middle" class="tiny">west court — 8 spaces</text>
    <rect class="stall" x="600" y="1178" width="24" height="52" /><rect class="stall" x="628" y="1178" width="24" height="52" /><rect class="stall" x="656" y="1178" width="24" height="52" /><rect class="stall" x="684" y="1178" width="24" height="52" />
    <rect class="stall" x="732" y="1178" width="24" height="52" /><rect class="stall" x="760" y="1178" width="24" height="52" /><rect class="stall" x="788" y="1178" width="24" height="52" /><rect class="stall" x="816" y="1178" width="24" height="52" />

    <rect class="court" x="1400" y="1060" width="215" height="82" rx="12" />
    <text x="1507" y="1048" text-anchor="middle" class="tiny">east court — 8 spaces</text>
    <rect class="stall" x="1415" y="1073" width="24" height="52" /><rect class="stall" x="1443" y="1073" width="24" height="52" /><rect class="stall" x="1471" y="1073" width="24" height="52" /><rect class="stall" x="1499" y="1073" width="24" height="52" />
    <rect class="stall" x="1547" y="1073" width="24" height="52" /><rect class="stall" x="1575" y="1073" width="24" height="52" /><rect class="stall" x="1603" y="1073" width="24" height="52" /><rect class="stall" x="1631" y="1073" width="24" height="52" />
  </g>

  <rect class="callout" x="75" y="230" width="590" height="205" rx="18" />
  <text x="105" y="275" class="note">Boundary-tightened version</text>
  <text x="105" y="315" class="tiny">• The gold outline is a tighter traced parcel envelope instead of the loose</text>
  <text x="105" y="345" class="tiny">  massing box I used earlier.</text>
  <text x="105" y="375" class="tiny">• The corrected entry still starts at your black Mayflower marker.</text>
  <text x="105" y="405" class="tiny">• This makes it easier to judge where the 18-unit idea starts to pinch.</text>
  <path class="arrow" d="M670,360 C730,340 790,370 855,445" />

  <rect class="callout" x="55" y="1325" width="620" height="185" rx="18" />
  <text x="90" y="1365" class="note">My honest read</text>
  <text x="90" y="1405" class="tiny">At this tighter boundary, 18 units still sketches in, but it is not generous.</text>
  <text x="90" y="1435" class="tiny">Parking and the no-build corridor are doing most of the squeezing.</text>
  <text x="90" y="1465" class="tiny">If you want a more comfortable premium feel, 16–17 units may ultimately fit better.</text>

  <rect class="callout" x="1535" y="1380" width="590" height="160" rx="18" />
  <text x="1568" y="1420" class="note">Next step if you want it</text>
  <text x="1568" y="1460" class="tiny">I can do one more pass that keeps this tighter trace but tests a 16-unit version</text>
  <text x="1568" y="1490" class="tiny">against the 18-unit version so we can see which one actually feels right.</text>
</svg>
