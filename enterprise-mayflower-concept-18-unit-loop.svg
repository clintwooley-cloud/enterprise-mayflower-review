<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">

  <style>
    .bg { fill:#f7f3ea; }
    .parcel { fill:#f5e6bf; stroke:#6e5a2f; stroke-width:4; }
    .road { fill:#8b8f97; stroke:#585d66; stroke-width:2; }
    .roadText { font: 700 24px Arial, sans-serif; fill:#ffffff; }
    .drive { fill:none; stroke:#676d75; stroke-width:50; stroke-linecap:round; }
    .driveMinor { fill:none; stroke:#676d75; stroke-width:36; stroke-linecap:round; }
