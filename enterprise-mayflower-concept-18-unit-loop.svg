<text x="1030" y="338" class="label">24x36 read on this plan</text>
<text x="1030" y="373" class="note">• Still workable at 18 units if cottages stay compact and consistent</text>
<text x="1030" y="403" class="note">• Loop works best if front porches face inward or toward the drive</text>
<text x="1030" y="433" class="note">• Good compromise between density and neighborhood feel</text>
<text x="1030" y="463" class="note">• Likely one of the more realistic 18-count massings</text>
