<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
  <style>
    .title { font:700 42px Arial,sans-serif; fill:#172028; }
    .subtitle { font:26px Arial,sans-serif; fill:#43515d; }
    .note { font:22px Arial,sans-serif; fill:#24323a; }
    .tiny { font:16px Arial,sans-serif; fill:#33424d; }
    .parcel { fill:#f4cf6a; fill-opacity:.16; stroke:#9a5a00; stroke-width:6; }
    .setback { fill:none; stroke:#b32525; stroke-width:5; stroke-dasharray:14 10; }
    .drive { fill:none; stroke:#616872; stroke-width:36; stroke-linecap:round; opacity:.92; }
    .court { fill:#ececec; stroke:#777; stroke-width:3; opacity:.96; }
    .stall { fill:#fafafa; stroke:#999; stroke-width:1.5; }
    .green { fill:#dff3df; stroke:#4b8c4b; stroke-width:4; stroke-dasharray:10 8; opacity:.85; }
    .cottage { fill:#d8f0d2; stroke:#3f6b3f; stroke-width:3; opacity:.95; }
    .cottageAlt { fill:#cae7f7; stroke:#37627b; stroke-width:3; opacity:.95; }
    .corridor { fill:#9fc6ea; stroke:#2e648f; stroke-width:4; stroke-dasharray:14 10; opacity:.45; }
    .callout { fill:#ffffff; stroke:#cfd8de; stroke-width:2; opacity:.96; }
    .arrow { fill:none; stroke:#27485d; stroke-width:3; marker-end:url(#arrow); }
    .target { fill:none; stroke:#b32525; stroke-width:5; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#27485d" /></marker></defs>
<image href="enterprise-plat-rendered.png" x="0" y="0" width="2200" height="1700" /><rect x="0" y="0" width="2200" height="185" fill="#f7f3ea" opacity=".88" /><text x="55" y="60" class="title">Enterprise / Mayflower concept F18 — 18-unit setback stress test</text><text x="55" y="102" class="subtitle">Rebuilt from actual plat • corrected Mayflower entry • same approximate 10' setback band</text><text x="55" y="142" class="tiny">Dashed red line = approximate 10' minimum setback study band, shown conceptually only and not survey-grade.</text><polygon class="parcel" points="855,448 1065,452 1250,535 1440,860 1505,1085 1340,1225 1085,1335 835,1260 660,1090 610,905 655,735 755,565" /><polygon class="setback" points="900,495 1035,500 1205,565 1380,870 1430,1060 1295,1180 1080,1260 860,1205 715,1060 680,910 720,760 800,610" /><polygon class="corridor" points="780,905 1005,860 1430,1210 1195,1320 930,1180" /><rect class="target" x="840" y="425" width="90" height="48" rx="6" /><path class="drive" d="M885,448 C905,540 965,650 1040,745 C1090,815 1145,900 1210,980" /><path class="drive" d="M1030,740 C920,785 815,850 725,955" /><path class="drive" d="M1080,795 C1225,820 1345,880 1450,970" /><rect class="green" x="1015" y="770" width="250" height="205" rx="22" /><text x="1140" y="865" text-anchor="middle" class="note">commons / green</text><text x="1140" y="895" text-anchor="middle" class="tiny">more compressed once 18 units are kept</text><rect class="cottage" x="790" y="545" width="90" height="60" rx="7" /><text x="835" y="582" text-anchor="middle" class="tiny">1</text><rect class="cottage" x="905" y="575" width="90" height="60" rx="7" /><text x="950" y="612" text-anchor="middle" class="tiny">2</text><rect class="cottage" x="1020" y="575" width="90" height="60" rx="7" /><text x="1065" y="612" text-anchor="middle" class="tiny">3</text><rect class="cottage" x="1135" y="585" width="90" height="60" rx="7" /><text x="1180" y="622" text-anchor="middle" class="tiny">4</text><rect class="cottage" x="1250" y="625" width="90" height="60" rx="7" /><text x="1295" y="662" text-anchor="middle" class="tiny">5</text><rect class="cottage" x="1355" y="710" width="90" height="60" rx="7" /><text x="1400" y="747" text-anchor="middle" class="tiny">6</text><rect class="cottage" x="1420" y="825" width="90" height="60" rx="7" /><text x="1465" y="862" text-anchor="middle" class="tiny">7</text><rect class="cottage" x="1430" y="945" width="90" height="60" rx="7" /><text x="1475" y="982" text-anchor="middle" class="tiny">8</text><rect class="cottage" x="1360" y="1060" width="90" height="60" rx="7" /><text x="1405" y="1097" text-anchor="middle" class="tiny">9</text><rect class="cottageAlt" x="1260" y="1150" width="90" height="60" rx="7" /><text x="1305" y="1187" text-anchor="middle" class="tiny">10</text><rect class="cottageAlt" x="1145" y="1205" width="90" height="60" rx="7" /><text x="1190" y="1242" text-anchor="middle" class="tiny">11</text><rect class="cottageAlt" x="1025" y="1215" width="90" height="60" rx="7" /><text x="1070" y="1252" text-anchor="middle" class="tiny">12</text><rect class="cottageAlt" x="905" y="1195" width="90" height="60" rx="7" /><text x="950" y="1232" text-anchor="middle" class="tiny">13</text><rect class="cottageAlt" x="785" y="1145" width="90" height="60" rx="7" /><text x="830" y="1182" text-anchor="middle" class="tiny">14</text><rect class="cottageAlt" x="700" y="1050" width="90" height="60" rx="7" /><text x="745" y="1087" text-anchor="middle" class="tiny">15</text><rect class="cottageAlt" x="655" y="935" width="90" height="60" rx="7" /><text x="700" y="972" text-anchor="middle" class="tiny">16</text><rect class="cottageAlt" x="680" y="820" width="90" height="60" rx="7" /><text x="725" y="857" text-anchor="middle" class="tiny">17</text><rect class="cottageAlt" x="735" y="700" width="90" height="60" rx="7" /><text x="780" y="737" text-anchor="middle" class="tiny">18</text><rect class="court" x="730" y="470" width="315" height="80" rx="12" /><text x="887" y="458" text-anchor="middle" class="tiny">front court — 10 spaces</text><rect class="stall" x="740" y="483" width="24" height="50" /><rect class="stall" x="768" y="483" width="24" height="50" /><rect class="stall" x="796" y="483" width="24" height="50" /><rect class="stall" x="824" y="483" width="24" height="50" /><rect class="stall" x="852" y="483" width="24" height="50" /><rect class="stall" x="900" y="483" width="24" height="50" /><rect class="stall" x="928" y="483" width="24" height="50" /><rect class="stall" x="956" y="483" width="24" height="50" /><rect class="stall" x="984" y="483" width="24" height="50" /><rect class="stall" x="1012" y="483" width="24" height="50" /><rect class="court" x="580" y="1145" width="210" height="80" rx="12" /><text x="685" y="1133" text-anchor="middle" class="tiny">west court — 8 spaces</text><rect class="stall" x="590" y="1158" width="24" height="50" /><rect class="stall" x="618" y="1158" width="24" height="50" /><rect class="stall" x="646" y="1158" width="24" height="50" /><rect class="stall" x="674" y="1158" width="24" height="50" /><rect class="stall" x="710" y="1158" width="24" height="50" /><rect class="stall" x="738" y="1158" width="24" height="50" /><rect class="stall" x="766" y="1158" width="24" height="50" /><rect class="stall" x="794" y="1158" width="24" height="50" /><rect class="court" x="1385" y="1035" width="210" height="80" rx="12" /><text x="1490" y="1023" text-anchor="middle" class="tiny">east court — 8 spaces</text><rect class="stall" x="1395" y="1048" width="24" height="50" /><rect class="stall" x="1423" y="1048" width="24" height="50" /><rect class="stall" x="1451" y="1048" width="24" height="50" /><rect class="stall" x="1479" y="1048" width="24" height="50" /><rect class="stall" x="1515" y="1048" width="24" height="50" /><rect class="stall" x="1543" y="1048" width="24" height="50" /><rect class="stall" x="1571" y="1048" width="24" height="50" /><rect class="stall" x="1599" y="1048" width="24" height="50" /><rect class="callout" x="70" y="1295" width="680" height="205" rx="18" /><text x="100" y="1338" class="note">Why 18 looks tighter</text><text x="100" y="1378" class="tiny">• Several cottages want to crowd the setback line.</text><text x="100" y="1408" class="tiny">• Parking and the corridor start competing for the same ground.</text><text x="100" y="1438" class="tiny">• It still sketches in conceptually, but it looks more like a squeeze than a premium cottage site.</text><text x="100" y="1468" class="tiny">• This is probably the ceiling, not the comfortable target.</text></svg>