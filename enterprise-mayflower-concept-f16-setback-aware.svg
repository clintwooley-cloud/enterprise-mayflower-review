    .callout { fill:#ffffff; stroke:#cfd8de; stroke-width:2; opacity:.96; }
    .arrow { fill:none; stroke:#27485d; stroke-width:3; marker-end:url(#arrow); }
    .target { fill:none; stroke:#b32525; stroke-width:5; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#27485d" /></marker></defs>
<image href="enterprise-plat-rendered.png" x="0" y="0" width="2200" height="1700" /><rect x="0" y="0" width="2200" height="185" fill="#f7f3ea" opacity=".88" /><text x="55" y="60" class="title">Enterprise / Mayflower concept F16 — 16-unit setback-aware comparison</text><text x="55" y="102" class="subtitle">Rebuilt from actual plat • corrected Mayflower entry • assumes roughly 10' minimum setback band</text><text x="55" y="142" class="tiny">Dashed red line = approximate 10' minimum setback study band, shown conceptually only and not survey-grade.</text><polygon class="parcel" points="855,448 1065,452 1250,535 1440,860 1505,1085 1340,1225 1085,1335 835,1260 660,1090 610,905 655,735 755,565" /><polygon class="setback" points="900,495 1035,500 1205,565 1380,870 1430,1060 1295,1180 1080,1260 860,1205 715,1060 680,910 720,760 800,610" /><polygon class="corridor" points="780,905 1005,860 1430,1210 1195,1320 930,1180" /><rect class="target" x="840" y="425" width="90" height="48" rx="6" /><path class="drive" d="M885,448 C905,540 965,650 1040,745 C1090,810 1145,895 1205,970" /><path class="drive" d="M1035,745 C925,790 820,855 740,945" /><path class="drive" d="M1085,800 C1220,825 1330,880 1425,960" /><rect class="green" x="1030" y="775" width="270" height="220" rx="24" /><text x="1165" y="875" text-anchor="middle" class="note">commons / paseo green</text><text x="1165" y="905" text-anchor="middle" class="tiny">more breathing room around cottages</text><rect class="cottage" x="815" y="560" width="92" height="62" rx="7" /><text x="861" y="598" text-anchor="middle" class="tiny">1</text><rect class="cottage" x="950" y="590" width="92" height="62" rx="7" /><text x="996" y="628" text-anchor="middle" class="tiny">2</text><rect class="cottage" x="1085" y="595" width="92" height="62" rx="7" /><text x="1131" y="633" text-anchor="middle" class="tiny">3</text><rect class="cottage" x="1210" y="635" width="92" height="62" rx="7" /><text x="1256" y="673" text-anchor="middle" class="tiny">4</text><rect class="cottage" x="1330" y="735" width="92" height="62" rx="7" /><text x="1376" y="773" text-anchor="middle" class="tiny">5</text><rect class="cottage" x="1410" y="860" width="92" height="62" rx="7" /><text x="1456" y="898" text-anchor="middle" class="tiny">6</text><rect class="cottage" x="1415" y="995" width="92" height="62" rx="7" /><text x="1461" y="1033" text-anchor="middle" class="tiny">7</text><rect class="cottage" x="1325" y="1100" width="92" height="62" rx="7" /><text x="1371" y="1138" text-anchor="middle" class="tiny">8</text><rect class="cottageAlt" x="1205" y="1170" width="92" height="62" rx="7" /><text x="1251" y="1208" text-anchor="middle" class="tiny">9</text><rect class="cottageAlt" x="1070" y="1210" width="92" height="62" rx="7" /><text x="1116" y="1248" text-anchor="middle" class="tiny">10</text><rect class="cottageAlt" x="930" y="1190" width="92" height="62" rx="7" /><text x="976" y="1228" text-anchor="middle" class="tiny">11</text><rect class="cottageAlt" x="800" y="1135" width="92" height="62" rx="7" /><text x="846" y="1173" text-anchor="middle" class="tiny">12</text><rect class="cottageAlt" x="705" y="1045" width="92" height="62" rx="7" /><text x="751" y="1083" text-anchor="middle" class="tiny">13</text><rect class="cottageAlt" x="665" y="925" width="92" height="62" rx="7" /><text x="711" y="963" text-anchor="middle" class="tiny">14</text><rect class="cottageAlt" x="690" y="805" width="92" height="62" rx="7" /><text x="736" y="843" text-anchor="middle" class="tiny">15</text><rect class="cottageAlt" x="745" y="690" width="92" height="62" rx="7" /><text x="791" y="728" text-anchor="middle" class="tiny">16</text><rect class="court" x="740" y="470" width="300" height="80" rx="12" /><text x="890" y="458" text-anchor="middle" class="tiny">front court — 10 spaces</text><rect class="stall" x="750" y="483" width="24" height="50" /><rect class="stall" x="778" y="483" width="24" height="50" /><rect class="stall" x="806" y="483" width="24" height=