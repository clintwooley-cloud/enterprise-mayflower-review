<text x="1030" y="338" class="label">24x36 read on this plan</text>
<text x="1030" y="373" class="note">• Probably the best-looking 18-unit community at this footprint</text>
<text x="1030" y="403" class="note">• Cottages get a stronger front-door relationship to the green</text>
<text x="1030" y="433" class="note">• Parking is easier to tuck to the edges and small courts</text>
<text x="1030" y="463" class="note">• My favorite if the goal is “premium cottage community”</text>
<text x="85" y="390" class="label">Approx. 101' frontage</text>
<text x="165" y="545" class="label">single entry boulevard</text>
