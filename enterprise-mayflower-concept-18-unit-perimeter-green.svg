<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">

  <style>
    .bg { fill:#f7f3ea; }
    .parcel { fill:#f5e6bf; stroke:#6e5a2f; stroke-width:4; }
    .road { fill:#8b8f97; stroke:#585d66; stroke-width:2; }
    .roadText { font: 700 24px Arial, sans-serif; fill:#ffffff; }
    .drive { fill:none; stroke:#676d75; stroke-width:50; stroke-linecap:round; }
    .driveMinor { fill:none; stroke:#676d75; stroke-width:36; stroke-linecap:round; }
    .cottage { fill:#d8f0d2; stroke:#3f6b3f; stroke-width:2; }
    .cottageAlt { fill:#cae7f7; stroke:#37627b; stroke-width:2; }
    .open { fill:#dff3df; stroke:#4b8c4b; stroke-width:3; stroke-dasharray:8 6; }
    .parking { fill:#ececec; stroke:#7a7a7a; stroke-width:2; }
    .corridor { fill:#b9d7f5; stroke:#3e6f9b; stroke-width:3; stroke-dasharray:12 8; opacity:.85; }
    .small { font: 18px Arial, sans-serif; fill:#27313a; }
    .tiny { font: 14px Arial, sans-serif; fill:#27313a; }
    .label { font: 700 20px Arial, sans-serif; fill:#1d2a33; }
    .title { font: 700 32px Arial, sans-serif; fill:#172028; }
    .subtitle { font: 21px Arial, sans-serif; fill:#43515d; }
    .note { font: 18px Arial, sans-serif; fill:#4c5b66; }
  </style>

  <rect class="bg" x="0" y="0" width="1400" height="980" />
  <text x="60" y="60" class="title">Enterprise / Mayflower concept E — 18-unit perimeter cottages + long common green</text>
  <text x="60" y="95" class="subtitle">Assumes avg. 24' x 36' site-built cottages (~864 sf) • condo/site-condo structure • concept only / not survey-grade</text>
  <path d="M180,180 L1020,150 L1180,350 L1120,820 L320,860 L140,620 Z" class="parcel" />
  <rect class="road" x="40" y="420" width="180" height="110" rx="8" /><text x="70" y="485" class="roadText">Mayflower St</text>
  <rect class="road" x="180" y="446" width="110" height="58" rx="8" />
  <polygon class="corridor" points="240,220 350,180 980,760 880,805" />
  <rect x="1030" y="70" width="320" height="215" rx="16" fill="#ffffff" stroke="#d0d8de" />
  <rect x="1060" y="105" width="36" height="24" class="cottage" /><text x="1110" y="124" class="small">24' x 36' avg. cottage footprint</text>
  <rect x="1060" y="145" width="34" height="24" class="parking" /><text x="1110" y="164" class="small">parking court / guest parking</text>
  <rect x="1060" y="185" width="34" height="24" class="corridor" /><text x="1110" y="204" class="small">creek + sewer easement spine</text>
  <rect x="1060" y="225" width="34" height="24" class="open" /><text x="1110" y="244" class="small">common green / amenity</text>
