<text x="180" y="545" class="label">Single controlled entry</text>
<text x="1030" y="300" class="label">Why 22 can work</text>
<text x="1030" y="335" class="note">• Keeps the creek/easement as a real amenity instead of fighting it</text>
<text x="1030" y="365" class="note">• Mix of 1BR / 2BR cottages works for flight-school demand</text>
<text x="1030" y="395" class="note">• Better than 25 for parking, stormwater, and fire access</text>
