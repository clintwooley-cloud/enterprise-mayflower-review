<text x="1030" y="338" class="label">24x36 read on this plan</text>
<text x="1030" y="373" class="note">• Feels tighter with 24x36 cottages, but still plausible</text>
<text x="1030" y="403" class="note">• Better if you want clustered phases or court identity</text>
<text x="1030" y="433" class="note">• Parking/circulation needs cleaner discipline than the loop plan</text>
<text x="1030" y="463" class="note">• Good backup option if you want smaller “pods” of cottages</text>
